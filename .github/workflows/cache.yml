name: Cache workflow

on:
  # workflow_dispatch:
  push:
    branches:
      - main  # <--- Added: Saves and binds cache to the main branch scope
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: cache vcpkg
      id: vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\vcpkg\archives
          build/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-
          ${{ runner.os }}-

    - name: build
      run: |
        vcpkg\bootstrap-vcpkg.bat
        vcpkg\vcpkg.exe install --triplet x64-windows
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
        cmake --build build --config Release
        cmake --build build --target package
        ls vcpkg
        ls ~\AppData\Local\vcpkg\archives
        ls build/vcpkg_installed

    - name: Tag Release
      uses: softprops/action-gh-release@v2
      # This step will only execute when triggered by a tag, ignoring standard pushes to main
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/*-win64.*

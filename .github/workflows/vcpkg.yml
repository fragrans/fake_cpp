name: Vcpkg workflow

on:
  # workflow_dispatch:
  push:
    branches:
      - main  # <--- Added: Saves and binds cache to the main branch scope
    tags:
      - "*.*.*"

jobs:
  build:
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build
      run: |
        vcpkg\bootstrap-vcpkg.bat
        vcpkg\vcpkg.exe install --triplet x64-windows
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
        cmake --build build --config Release
        cmake --build build --target package
        ls vcpkg
        ls ~\AppData\Local\vcpkg\archives
        ls build/vcpkg_installed

    - name: Tag Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/*-win64.msi

    - name: Latest Release
      uses: softprops/action-gh-release@v2
      if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
      with:
        tag_name: "latest"          # Sets a fixed tag name
        name: "Latest Development Build"
        files: build/*-win64.msi
        overwrite_files: true
        prerelease: true            # Optional: Mark as pre-release
      # env:
      #  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
